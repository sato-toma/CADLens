name: Bug
description: Something does not work as expected.
title: "[Bug] "
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach or paste confidential or restricted data. This includes CAD/STEP models, other binary files, screenshots, logs, credentials, personal data, and anything derived from them.
        Describe the problem instead, for example the file size and whether it is a single part or an assembly.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Where did it happen?
      options:
        - Desktop browser
        - Mobile browser
        - Windows app
        - Android app
        - Tests or CI
        - Other
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Error messages and environment
      description: Optional. Console errors, browser name, and file size.
      render: text
    validations:
      required: false
